# Phase 0.1. Install once:  pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      # no-commit-to-branch is deliberately NOT enabled: this project commits
      # straight to main (hackathon workflow, see CLAUDE.md). Leaving it armed
      # would block every commit as soon as anyone ran `pre-commit install`.

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^api/
      - id: ruff-format
        files: ^api/

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^api/
