[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "result-guardian-api"
version = "0.1.0"
description = "Result Guardian — NODE A core API. Post-discharge pending result tracking."
requires-python = ">=3.11,<3.12"
# Proprietary. All rights reserved — see the LICENSE file at the repository root.
# Declared here so packaging tools cannot infer a permissive default, and so a
# wheel built from this source carries the restriction with it.
license = { text = "Proprietary — All Rights Reserved" }
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "pgvector>=0.3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "uuid7>=0.1",
    # Phase 4.3's template store: "Jinja2 files per template_key x locale".
    # A runtime dependency, not a dev one -- templates render at send time.
    "jinja2>=3.1",
    # Phase 5.1. The plan names Argon2id specifically; argon2-cffi is the
    # reference implementation and the one OWASP points at.
    "argon2-cffi>=23.1",
    # Phase 5.1's JWT. PyJWT rather than python-jose: fewer transitive
    # dependencies and it is the library FastAPI's own docs use.
    "pyjwt>=2.8",
    # ── Phase 6 · document ingestion ──────────────────────────────
    # 6.2/6.3: text per page with bounding boxes, and page rendering for the
    # scanned path and the review overlay. The plan names PyMuPDF directly.
    "pymupdf>=1.24",
    # 6.2: "Corrupt PDF -> repair attempt via pikepdf". Small, and it is the
    # only thing between a damaged file and a useless error message.
    "pikepdf>=9.0",
    # 6.4: OpenCV preprocessing before OCR. The headless build -- the GUI one
    # pulls X11 libraries a server container has no use for.
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.3",
    # MIME sniffing for 6.1: "do not trust the extension".
    "python-magic>=0.4.27",
    # Multipart upload parsing for POST /api/reports/upload.
    "python-multipart>=0.0.9",
    # 6.4's OCR engine, named by the plan. CPU build: NODE A has no discrete
    # GPU and must not need one -- RULE 2 keeps inference on NODE B, and OCR
    # is not inference the safety property depends on.
    #
    # ⚠️ **Both pinned exactly**, unlike everything above, and the pins are
    # load-bearing. paddlepaddle ships a compiled core and paddleocr ships
    # models built against it; a mismatch does not fail at install or at
    # import, it fails **on every page at inference time**.
    #
    # This is not hypothetical. paddlepaddle 3.0.0 with paddleocr 3.7.0 gave
    # `ValueError: Type of attribute: strides is not right` when loading the
    # PP-OCRv6 model — after constructing the engine without complaint. 3.3.1
    # is the combination that was actually run and actually recognised text.
    #
    # `app/services/documents/ocr.py` degrades to `needs_review` if any of
    # this breaks, so a bad upgrade costs accuracy, never availability. Check
    # the runbook's §9 before changing either number.
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.5",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    # Phase 3.8's gold set is YAML so a clinician can read and edit it without
    # a Python editor. It arrives transitively today; declared here because a
    # test suite that silently depends on somebody else's transitive pin is a
    # CI failure waiting for an unrelated upgrade.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

# api/ is a flat layout holding app/, worker/, tests/ and alembic/. Without an
# explicit list, package discovery either guesses or refuses outright, and
# `pip install -e ".[dev]"` fails before a single check runs. tests/ and
# alembic/ are deliberately absent: they are run from the source tree, never
# installed.
[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
# 88, black's default, because that is what the code is actually written to.
# At 100 black reformats working files on sight and CI goes red on style.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = [
  "B008",  # FastAPI Depends() in defaults is the documented idiom
  # RUF001/RUF002 flag "ambiguous" Unicode -- characters that look like ASCII
  # but are not. In this codebase they are deliberate typography in text a
  # clinician reads: an EN DASH in a reference range ("3.5 – 5.1"), a
  # MULTIPLICATION SIGN in a multiplier ("more than 3x the upper limit"), an
  # EM DASH in prose. Replacing them with hyphens would make a range read as
  # a subtraction. The homoglyph risk these rules guard against is real in
  # identifiers, which RUF003 still covers -- not in display strings.
  "RUF001",
  "RUF002",
]

[tool.ruff.lint.isort]
# `api/alembic/` is the migrations directory, not a package, so ruff otherwise
# infers the `alembic` library itself as first-party and demands it be sorted
# alongside `app`. It is third-party; say so.
known-third-party = ["alembic"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uuid_extensions.*", "testcontainers.*"]
ignore_missing_imports = true

# Phase 6's native libraries. PyMuPDF, OpenCV, pikepdf and PaddleOCR are all
# C extensions with partial or absent type information: PyMuPDF ships stubs
# that mark its own constructors untyped, and PaddleOCR ships none at all.
#
# `disallow_untyped_calls` is turned off **only for calls into these modules**
# — everything we write is still checked under full strict mode, and the
# thin wrappers in `app/services/documents/` (`render_page`, `inspect`,
# `extract_page`) are all annotated, so the untyped surface stops at the
# library boundary rather than leaking into the pipeline.
[[tool.mypy.overrides]]
module = ["pymupdf.*", "fitz.*", "paddleocr.*", "paddle.*", "cv2.*", "pikepdf.*", "magic.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

# The call sites, which is where mypy actually reports an untyped call.
[[tool.mypy.overrides]]
module = [
  "app.services.documents.detect",
  "app.services.documents.native",
  "app.services.documents.render",
  "app.services.documents.ocr",
  "app.services.documents.preprocess",
  "app.services.documents.pipeline",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `scripts/` is deliberately NOT a declared wheel package -- the seed script
# writes fake patients and has no business in the runtime image. It still has
# to be importable by its tests, so put the project root on the path here
# rather than shipping it.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    # Talks to a real Postgres with pgmq. Skips itself when none is reachable,
    # so the suite still runs with nothing else up. Deselect with -m "not integration".
    "integration: requires a live Postgres with the pgmq extension",
]

[tool.coverage.report]
fail_under = 70
