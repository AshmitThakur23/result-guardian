[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "result-guardian-api"
version = "0.1.0"
description = "Result Guardian — NODE A core API. Post-discharge pending result tracking."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "uuid7>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.5",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

# api/ is a flat layout holding app/, worker/, tests/ and alembic/. Without an
# explicit list, package discovery either guesses or refuses outright, and
# `pip install -e ".[dev]"` fails before a single check runs. tests/ and
# alembic/ are deliberately absent: they are run from the source tree, never
# installed.
[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
# 88, black's default, because that is what the code is actually written to.
# At 100 black reformats working files on sight and CI goes red on style.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.ruff.lint.isort]
# `api/alembic/` is the migrations directory, not a package, so ruff otherwise
# infers the `alembic` library itself as first-party and demands it be sorted
# alongside `app`. It is third-party; say so.
known-third-party = ["alembic"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uuid_extensions.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.report]
fail_under = 70
