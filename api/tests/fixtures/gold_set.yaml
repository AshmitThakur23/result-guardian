  # ── Rule B — culture and sensitivity ─────────────────────────────

  - id: B01
    provenance: synthetic
    rule: B
    description: >-
      ★ EXIT GATE 3. E. coli resistant to ceftriaxone, patient discharged on
      Monocef. The case the product exists for.
    order: { category: micro, test_code: URC, test_name: Urine Culture }
    encounter:
      discharge_antibiotics: [Monocef]
    content:
      organisms:
        - organism_name: Escherichia coli
          colony_count: ">100,000 CFU/mL"
          specimen_type: urine
          sensitivities:
            - { antibiotic_name: Ceftriaxone, interpretation: R }
            - { antibiotic_name: Nitrofurantoin, interpretation: S }
    expected_severity: critical
    expected_reason_codes: [CULT_RESISTANT_TO_DISCHARGE_DRUG]
    expected_auto_close: false

  - id: B02
