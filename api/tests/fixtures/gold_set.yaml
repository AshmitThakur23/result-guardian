# ═══════════════════════════════════════════════════════════════════════
#  RESULT GUARDIAN — RULE ENGINE GOLD SET
# ═══════════════════════════════════════════════════════════════════════
#
#  ⚠️  NO CLINICIAN HAS REVIEWED ANY ENTRY IN THIS FILE.  ⚠️
#
#  Every case below is SYNTHETIC — written by the engineering team to
#  exercise the rules. None of it is a real patient result, none of it is
#  anonymised real data, and the `expected_severity` on each entry is the
#  engineering team's expectation, NOT a clinician's judgement.
#
#  Phase 3.8 asks for something this file is not:
#
#      Build a gold set: 100+ real anonymised results spanning all three
#      rule types. Sit with a clinician, walk every disagreement, tune
#      thresholds, not code. Record final agreement rate in
#      docs/clinical-validation.md.
#
#  So this file is the HARNESS, populated with placeholder cases. It is a
#  genuine regression net — it will catch a rule change that alters an
#  answer — and it is NOT evidence of clinical correctness.
#
#  EXIT GATE 3 REQUIRES ≥95% AGREEMENT WITH A CLINICIAN.
#  THAT NUMBER DOES NOT EXIST YET AND MUST NOT BE INVENTED.
#  See docs/clinical-validation.md.
#
#  ── How a hospital replaces this file ──────────────────────────────
#
#  1. Export 100+ real results, anonymised, spanning all three rule types.
#  2. Write one entry per result, with `provenance: real_anonymised` and
#     `reviewed_by` naming the clinician who set `expected_severity`.
#  3. Run `pytest tests/test_gold_set.py`. Every failure is a disagreement.
#  4. Walk each disagreement with the clinician. **Tune thresholds in the
#     configuration tables, not the rule code** — a rule changed to satisfy
#     one case is a rule nobody can predict.
#  5. Record the final agreement rate in docs/clinical-validation.md.
#
# ═══════════════════════════════════════════════════════════════════════

meta:
  # Read by the test suite, which refuses to report an agreement rate while
  # this is false. The refusal is the point: a percentage in a report reads
  # as clinical validation whether or not the surrounding prose says
  # otherwise.
  clinician_validated: false
  reviewed_by: null
  reviewed_on: null
  source: >-
    Synthetic cases written by the engineering team against the Phase 3 build
    plan. Not real patient data. Not clinically reviewed.
  # The engine version these expectations were written against. A new major
  # version is a reason to re-walk the set with a clinician, not to edit the
  # expectations until they pass.
  engine_version: "3.0.0"
  # The thresholds these expectations assume. They are the development
  # placeholders, not a hospital's critical-value list.
  rule_config: "scripts/seed_rules_dev.py placeholders"

