# Result Guardian — NODE A stack.
#
# NODE B (Ollama) is deliberately NOT in this file. It is a deployment target
# on another machine, not a service in this compose project. See
# docs/adr/0002-two-node-split.md. Bring NODE B up with
# docker-compose.nodeb.yml on that machine, or provision it natively with
# infra/nodeb/setup.sh (Ubuntu) / setup-windows.ps1 (Windows).

name: result-guardian

services:
  postgres:
    build:
      context: ./infra/postgres
    image: result-guardian/postgres:16
    # pg_cron must be preloaded at server start and can only be created in the
    # ONE database named by cron.database_name. Baking that name into the image
    # while POSTGRES_DB stays configurable means a renamed database silently
    # boots without pg_cron -- and pg_cron is the entire basis of Phase 2's
    # "NODE A reboots, no timer is lost" guarantee.
    #
    # Compose interpolates ${...} here at parse time, which an exec-form CMD
    # cannot do, so one variable now drives both. $1 is still `postgres`, so
    # the official entrypoint's first-run init still happens.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB:-result_guardian}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-result_guardian}
      POSTGRES_USER: ${POSTGRES_USER:-rg_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rg_app} -d ${POSTGRES_DB:-result_guardian}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [rg]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  api:
    build:
      context: ./api
      # Explicit, because `dev` is the LAST stage in api/Dockerfile and would
      # otherwise be what a no-target build produces -- shipping pytest, ruff
      # and mypy to a hospital server. docker-compose.override.yml overrides
      # this back to `dev` for local work. Phase 10.1.
      target: runtime
    image: result-guardian/api:dev
    env_file: [.env]
    environment:
      RG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rg_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-result_guardian}
    # Phase 6. The API writes uploads here and serves the page images the
    # worker renders; the worker reads the files and writes the renders. They
    # MUST be the same volume -- two copies means the API serves a 404 for
    # every image the worker produced, and the fallback form has nothing to
    # show.
    volumes:
      - rgdocs:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [rg]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  worker:
    build:
      context: ./api
      target: runtime   # same image as api, different entrypoint. See above.
    image: result-guardian/api:dev
    command: ["python", "-m", "worker.main"]
    env_file: [.env]
    environment:
      RG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rg_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-result_guardian}
    volumes:
      - rgdocs:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [rg]
    # SIGTERM -> finish the in-flight message, then exit. Phase 0.7.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # ★ Raised from 2.0 for Phase 6, and the number is measured, not
          # guessed. OCR is the only CPU-bound work this system does: one
          # scanned A4 page at 200 DPI took **115 seconds** at a 2-CPU quota,
          # which does not fit inside 6.5's 120-second budget once model
          # loading is counted — so every scanned page would have timed out
          # and gone to a human, making the whole scanned path useless.
          #
          # Thread oversubscription was ruled out first: the container sees
          # `nproc` 12 regardless of the quota, but pinning OMP_NUM_THREADS to
          # match made no difference (116.3s vs 115.4s). It is simply
          # CPU-bound.
          #
          # NODE A has 8 physical / 12 logical cores, so 6 leaves ample room
          # for Postgres, the API and the machine's owner.
          cpus: "6.0"
          # Raised from 1G for Phase 6, then from 3G to 4G after a real OOM.
          #
          # PaddleOCR loads detection and recognition models and then works on
          # a multi-megapixel page. At 3G an 11 MP render was SIGKILLed by the
          # OOM killer — and because extraction ran in the worker process at
          # the time, that killed the SLA-timer and notification consumers too.
          #
          # Two things now stand between that and a repeat, and the memory
          # limit is the *weaker* of them: `render.py` caps a page at 4.2 MP,
          # and extraction runs in a child process so an OOM costs one
          # document rather than the worker. This headroom is the belt to
          # those braces — **do not lower it without re-running a scanned
          # document end to end.**
          memory: 4G

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
    networks: [rg]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  # Phase 6. Original documents, rendered page images, and the watched-folder
  # inbox/processing/archive tree. A named volume rather than a bind mount so
  # the files survive `docker compose down` -- these are clinical records, and
  # `documents.storage_path` points at them.
  rgdocs:

networks:
  rg:
    driver: bridge
