# Keep the README's four count badges honest by recounting the repository.
#
# The rule this automates: a number nobody measured is a number nobody should
# trust. Hand-typed counts rot silently -- somebody deletes a test file and the
# README goes on asserting the figure it was given the day it was written.
#
# Deliberately NOT part of the CI gate. A stale badge is a documentation bug,
# not a broken build, and failing a pull request over it would teach people to
# ignore a red check.

name: README stats

on:
  push:
    branches: [main]
    # Only when something that feeds a count actually changed. Without this the
    # job would wake on every docs-only commit and find nothing to do.
    paths:
      - "api/app/db/models/**"
      - "api/alembic/versions/**"
      - "api/app/**/*.py"
      - "api/tests/**"
      - "web/src/**/*.test.ts"
      - "web/src/**/*.test.tsx"
      - "web/e2e/**/*.spec.ts"
      - "scripts/update_readme_stats.py"
      - ".github/workflows/readme-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two pushes in quick succession would otherwise race to commit the same file.
  group: readme-stats
  cancel-in-progress: true

jobs:
  recount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recount the repository
        run: python scripts/update_readme_stats.py

      - name: Commit only if the numbers moved
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already matches the repository. Nothing to do."
            exit 0
          fi

          git config user.name  "AshmitThakur23"
          git config user.email "ashmitthakur615@gmail.com"
          git add README.md

          # [skip ci] so this commit does not re-trigger the workflows. Without
          # it, a bot commit touching README.md would wake every push-triggered
          # job for a change no human made.
          git commit -m "docs: recount README stats from the repository [skip ci]"
          git push
